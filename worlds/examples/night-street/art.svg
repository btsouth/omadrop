  <rect id="shop-right-eave" data-name="shop-right-eave" x="1100" y="370" width="740" height="12" fill="#030b09"/>
  <rect id="shop-right-door" data-name="shop-right-door" x="1620" y="740" width="130" height="190" rx="6" fill="#030c09" stroke="#1d3b31" stroke-width="5"/>
  <rect id="right-window-0" data-name="window.band2.always" x="1170" y="430" width="110" height="130" rx="6" fill="#10201b" stroke="#c99a58" stroke-width="6"/>
