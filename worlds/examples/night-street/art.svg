  <rect id="right-window-3" data-name="window.band3.always" x="1650" y="430" width="110" height="130" rx="6" fill="#10201b" stroke="#c99a58" stroke-width="6"/>
  <rect id="right-window-4" data-name="window.band0.kick" x="1170" y="760" width="130" height="120" rx="6" fill="#10201b" stroke="#c99a58" stroke-width="6"/>

