  <path id="wire-left" data-name="wire.band1.pulse" d="M580 380 C 680 450 760 490 838 524" fill="none" stroke="#030b09" stroke-width="2"/>
  <path id="wire-right" data-name="wire.band4.pulse" d="M846 530 C 980 470 1060 420 1112 392" fill="none" stroke="#030b09" stroke-width="2"/>
