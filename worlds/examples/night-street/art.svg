  <rect id="shop-left-door" data-name="shop-left-door" x="270" y="730" width="130" height="200" rx="6" fill="#030c09" stroke="#1d3b31" stroke-width="5"/>
  <rect id="left-window-0" data-name="window.band1.always" x="110" y="490" width="120" height="120" rx="6" fill="#10201b" stroke="#c99a58" stroke-width="6"/>
